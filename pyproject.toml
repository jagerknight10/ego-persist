[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wise_egomap"
version = "0.1.0"
description = "Causal map maintenance for egocentric 4D mapping"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "WISE-EgoMap contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.3,<3",
  "scikit-learn>=1.4,<2",
]
demo = [
  "matplotlib>=3.8,<4",
]
aria = [
  "projectaria-tools==2.3.0",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
wise_egomap = "wise_egomap.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wise_egomap"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
