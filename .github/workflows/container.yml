name: Container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "environment/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  build:
    if: hashFiles('uv.lock') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build container
        run: |
          export WISE_EGOMAP_IMAGE="${RUNNER_TEMP}/wise-egomap.sif"
          bash scripts/build_container.sh

      - name: Test container
        run: |
          apptainer test "${RUNNER_TEMP}/wise-egomap.sif"
